<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PetCare - Painel do Tutor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>
    const user = JSON.parse(sessionStorage.getItem('user'));
    if (!user || user.perfil !== 'TUTOR') window.location.href = 'login.html';
  </script>
</head>
<body class="bg-light p-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <h3>🐾 PetCare - Olá, <span id="uName"></span></h3>
      <button class="btn btn-outline-danger" onclick="sessionStorage.clear(); window.location.href='login.html'">Sair</button>
    </div>

    <div class="row g-4 mb-4">
      <!-- Cadastrar Pet -->
      <div class="col-md-5">
        <div class="card p-3 shadow-sm border-0">
          <h5 class="fw-bold">Cadastrar Meu Pet</h5>
          <hr>
          <form id="fPet">
            <div class="mb-2">
              <label class="form-label small text-muted">Nome do Pet</label>
              <input type="text" id="pNome" class="form-control" required>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small text-muted">Espécie</label>
                <select id="pEspecie" class="form-select" required>
                  <option value="CAO">Cão</option>
                  <option value="GATO">Gato</option>
                  <option value="AVE">Ave</option>
                  <option value="ROEDOR">Roedor</option>
                  <option value="OUTRO">Outro</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Sexo</label>
                <select id="pSexo" class="form-select" required>
                  <option value="M">Macho</option>
                  <option value="F">Fêmea</option>
                </select>
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small text-muted">Raça</label>
                <input type="text" id="pRaca" class="form-control" placeholder="SRD">
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Peso (kg)</label>
                <input type="number" step="0.01" id="pPeso" class="form-control" placeholder="0.00">
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small text-muted">Nascimento</label>
                <input type="date" id="pNasc" class="form-control">
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Microchip (opcional)</label>
                <input type="text" id="pChip" class="form-control">
              </div>
            </div>
            <button class="btn btn-dark w-100 fw-bold" type="submit">Cadastrar Pet</button>
          </form>
        </div>
      </div>

      <!-- Meus Pets -->
      <div class="col-md-7">
        <div class="card p-3 shadow-sm border-0">
          <h5 class="fw-bold">Meus Pets</h5>
          <hr>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr><th>Nome</th><th>Espécie</th><th>Raça</th><th>Sexo</th><th>Peso</th><th>Ações</th></tr>
              </thead>
              <tbody id="tbMeusPets"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- Agendar Consulta -->
      <div class="col-md-5">
        <div class="card p-3 shadow-sm border-0">
          <h5 class="fw-bold">Agendar Atendimento</h5>
          <hr>
          <form id="fConsulta">
            <div class="mb-2">
              <label class="form-label small text-muted">Pet</label>
              <select id="cPet" class="form-select" required></select>
            </div>
            <div class="mb-2">
              <label class="form-label small text-muted">Veterinário</label>
              <select id="cVet" class="form-select" required></select>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small text-muted">Tipo</label>
                <select id="cTipo" class="form-select" required>
                  <option value="CONSULTA">Consulta</option>
                  <option value="VACINA">Vacina</option>
                  <option value="EXAME">Exame</option>
                  <option value="CIRURGIA">Cirurgia</option>
                  <option value="RETORNO">Retorno</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Data e Hora</label>
                <input type="datetime-local" id="cData" class="form-control" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">Observações / Sintomas</label>
              <textarea id="cObs" class="form-control" rows="2" placeholder="Descreva o motivo do atendimento"></textarea>
            </div>
            <button class="btn btn-warning w-100 fw-bold" type="submit">Solicitar Agendamento</button>
          </form>
        </div>
      </div>

      <!-- Minhas Consultas -->
      <div class="col-md-7">
        <div class="card p-3 shadow-sm border-0">
          <h5 class="fw-bold">Histórico de Consultas</h5>
          <hr>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr><th>Pet</th><th>Veterinário</th><th>Tipo</th><th>Data</th><th>Status</th><th>Valor</th><th>Ações</th></tr>
              </thead>
              <tbody id="tbMinhasConsultas"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Genérico -->
  <div class="modal fade" id="modalGenerico" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header text-white" id="modalGenericoHeader">
          <h5 class="modal-title fw-bold" id="modalGenericoTitle">Aviso</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4 text-center">
          <p class="mb-0 fs-5 text-muted" id="modalGenericoText"></p>
        </div>
        <div class="modal-footer justify-content-center border-0 pb-4" id="modalGenericoFooter">
          <button type="button" class="btn btn-secondary w-50 fw-bold" data-bs-dismiss="modal">Entendido</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('uName').innerText = user.nome;
    const h = { 'Authorization': 'Bearer ' + sessionStorage.getItem('token'), 'Content-Type': 'application/json' };

    function showModal(title, text, type = 'success', onConfirm = null) {
      document.getElementById('modalGenericoTitle').innerText = title;
      document.getElementById('modalGenericoText').innerText = text;
      const header = document.getElementById('modalGenericoHeader');
      const footer = document.getElementById('modalGenericoFooter');

      header.className = 'modal-header text-white ' + (type === 'success' ? 'bg-success' : (type === 'error' ? 'bg-danger' : 'bg-warning text-dark'));
      if (type === 'warning') header.querySelector('.btn-close').classList.remove('btn-close-white');
      else header.querySelector('.btn-close').classList.add('btn-close-white');

      const modal = new bootstrap.Modal(document.getElementById('modalGenerico'));
      if (onConfirm) {
        footer.innerHTML = `
          <button type="button" class="btn btn-outline-secondary w-25 fw-bold" data-bs-dismiss="modal">Não</button>
          <button type="button" class="btn btn-danger w-25 fw-bold" id="modalConfirmBtn">Sim</button>
        `;
        document.getElementById('modalConfirmBtn').onclick = () => { onConfirm(); modal.hide(); };
      } else {
        footer.innerHTML = '<button type="button" class="btn btn-secondary w-50 fw-bold" data-bs-dismiss="modal">Entendido</button>';
      }
      modal.show();
    }

    const statusBadge = {
      AGENDADA: 'bg-warning text-dark',
      EM_ANDAMENTO: 'bg-info text-dark',
      CONCLUIDA: 'bg-success text-white',
      CANCELADA: 'bg-danger text-white'
    };

    async function loadData() {
      const [pets, vets, consultas] = await Promise.all([
        fetch(`/api/pets/tutor/${user.tutor_id}`, { headers: h }).then(r => r.json()),
        fetch('/api/veterinarios', { headers: h }).then(r => r.json()),
        fetch(`/api/consultas/tutor/${user.tutor_id}`, { headers: h }).then(r => r.json())
      ]);

      document.getElementById('tbMeusPets').innerHTML = pets.length
        ? pets.map(p => `<tr>
            <td class="fw-semibold">${p.nome}</td>
            <td>${p.especie}</td>
            <td>${p.raca}</td>
            <td>${p.sexo}</td>
            <td>${Number(p.peso_kg).toFixed(2)} kg</td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="deletarPet(${p.id}, '${p.nome}')">Excluir</button></td>
          </tr>`).join('')
        : '<tr><td colspan="6" class="text-center text-muted">Nenhum pet cadastrado.</td></tr>';

      document.getElementById('cPet').innerHTML = '<option value="" disabled selected>Escolha seu pet...</option>' +
        pets.map(p => `<option value="${p.id}">${p.nome} (${p.especie})</option>`).join('');

      document.getElementById('cVet').innerHTML = '<option value="" disabled selected>Escolha o veterinário...</option>' +
        vets.filter(v => v.status === 'ATIVO').map(v => `<option value="${v.id}">${v.nome} - ${v.especialidade}</option>`).join('');

      document.getElementById('tbMinhasConsultas').innerHTML = consultas.length
        ? consultas.map(c => `<tr>
            <td class="fw-semibold">${c.pet_nome}</td>
            <td>${c.veterinario_nome}</td>
            <td>${c.tipo_atendimento}</td>
            <td>${new Date(c.data_consulta).toLocaleString('pt-BR')}</td>
            <td><span class="badge ${statusBadge[c.status] || 'bg-secondary'}">${c.status}</span></td>
            <td>R$ ${Number(c.valor || 0).toFixed(2)}</td>
            <td>${c.status === 'AGENDADA' ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelarConsulta(${c.id})">Cancelar</button>` : '-'}</td>
          </tr>`).join('')
        : '<tr><td colspan="7" class="text-center text-muted">Nenhuma consulta registrada.</td></tr>';
    }

    document.getElementById('fPet').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch('/api/pets', {
        method: 'POST',
        headers: h,
        body: JSON.stringify({
          tutor_id: user.tutor_id,
          nome: document.getElementById('pNome').value,
          especie: document.getElementById('pEspecie').value,
          sexo: document.getElementById('pSexo').value,
          raca: document.getElementById('pRaca').value || 'SRD',
          peso_kg: document.getElementById('pPeso').value || 0,
          data_nascimento: document.getElementById('pNasc').value || null,
          microchip: document.getElementById('pChip').value || null
        })
      });
      if (res.ok) {
        showModal('Sucesso', 'Pet cadastrado com sucesso!', 'success');
        document.getElementById('fPet').reset();
        loadData();
      } else {
        const err = await res.json();
        showModal('Erro', err.error || 'Erro ao cadastrar pet.', 'error');
      }
    };

    function deletarPet(id, nome) {
      showModal('Excluir Pet', `Deseja remover "${nome}"?`, 'warning', async () => {
        const res = await fetch(`/api/pets/${id}`, { method: 'DELETE', headers: h });
        if (!res.ok) {
          const err = await res.json();
          showModal('Aviso', err.error, 'warning');
        }
        loadData();
      });
    }

    document.getElementById('fConsulta').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch('/api/consultas', {
        method: 'POST',
        headers: h,
        body: JSON.stringify({
          pet_id: document.getElementById('cPet').value,
          veterinario_id: document.getElementById('cVet').value,
          tipo_atendimento: document.getElementById('cTipo').value,
          data_consulta: document.getElementById('cData').value,
          observacoes: document.getElementById('cObs').value
        })
      });
      if (res.ok) {
        showModal('Agendado!', 'Consulta solicitada com sucesso.', 'success');
        document.getElementById('fConsulta').reset();
        loadData();
      } else {
        const err = await res.json();
        showModal('Erro', err.error || 'Erro ao agendar.', 'error');
      }
    };

    function cancelarConsulta(id) {
      showModal('Cancelar Consulta', 'Tem certeza que deseja cancelar esta consulta?', 'warning', async () => {
        await fetch(`/api/consultas/${id}/processar`, {
          method: 'PUT',
          headers: h,
          body: JSON.stringify({ status: 'CANCELADA' })
        });
        loadData();
      });
    }

    loadData();
  </script>
</body>
</html>
