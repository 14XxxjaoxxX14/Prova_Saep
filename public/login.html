<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PetCare - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100" style="background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%);">
  
  <div class="card p-4 shadow-lg border-0" style="width:420px;">
    <h3 class="text-center fw-bold" style="color: #0f766e;">🐾 PetCare</h3>
    <p class="text-center text-muted small">Clínica Veterinária & Pet Shop</p>
    <div id="alerta" class="alert alert-danger d-none small text-center"></div>
    <form id="formLogin">
      <input type="email" id="usuario" class="form-control mb-3" placeholder="E-mail" required>
      <input type="password" id="senha" class="form-control mb-3" placeholder="Senha" required>
      <button class="btn btn-petcare w-100 fw-bold" type="submit">Entrar</button>
      <hr>
      <div class="text-center">
        <span class="small text-muted">Ainda não tem cadastro de tutor?</span>
        <button type="button" class="btn btn-outline-secondary btn-sm ms-2" data-bs-toggle="modal" data-bs-target="#modalCadastro">Cadastrar-se</button>
      </div>
    </form>
  </div>


  <!-- MODAL DE CADASTRO (TUTOR) -->
  <div class="modal fade" id="modalCadastro" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-petcare">
          <h5 class="modal-title fw-bold">Cadastro de Tutor</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formCadastro">
            <div class="mb-3">
              <label class="form-label">Nome Completo</label>
              <input type="text" id="cadNome" class="form-control" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">CPF (Apenas números)</label>
                <input type="text" id="cadCpf" class="form-control" maxlength="11" oninput="this.value = this.value.replace(/\D/g, '')" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Telefone / WhatsApp</label>
                <input type="text" id="cadTel" class="form-control" placeholder="(75) 99999-9999" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Telefone / WhatsApp</label>
              <input type="text" id="cadTelefone" class="form-control" placeholder="(11) 99999-9999" required>
            </div>
            <div class="mb-3">
              <label class="form-label">E-mail</label>
              <input type="email" id="cadEmail" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Endereço (Opcional)</label>
              <input type="text" id="cadEnd" class="form-control" placeholder="Rua, número, bairro">
            </div>
            <button type="submit" class="btn btn-petcare w-100 fw-bold">Confirmar Cadastro</button>
          </form>
        </div>
      </div>
    </div>
  </div>


  <!-- Modal Cadastro Sucesso -->
  <div class="modal fade" id="modalCadastroSucesso" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title fw-bold">Bem-vindo à PetCare!</h5>
        </div>
        <div class="modal-body p-4 text-center">
          <h4 class="text-success mb-3">Cadastro Concluído</h4>
          <p class="text-muted">A sua conta de tutor foi criada com sucesso.</p>
          <div class="alert alert-warning text-dark text-start">
            <strong>⚠️ Atenção:</strong> Para efetuar o login, a sua senha de acesso inicial é o seu <strong>próprio CPF</strong> (apenas números).
          </div>
          <button type="button" class="btn btn-success w-100 fw-bold mt-2" onclick="window.location.reload()">Fazer Login Agora</button>
        </div>
      </div>
    </div>
  </div>


  <!-- Modal Genérico -->
  <div class="modal fade" id="modalGenerico" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header text-white" id="modalGenericoHeader">
          <h5 class="modal-title fw-bold" id="modalGenericoTitle">Aviso</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4 text-center">
          <p class="mb-0 fs-5 text-muted" id="modalGenericoText"></p>
        </div>
        <div class="modal-footer justify-content-center border-0 pb-4">
          <button type="button" class="btn btn-secondary w-50 fw-bold" data-bs-dismiss="modal" id="modalGenericoBtn">Entendido</button>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function showModal(title, text, type = 'success') {
      document.getElementById('modalGenericoTitle').innerText = title;
      document.getElementById('modalGenericoText').innerText = text;
      const header = document.getElementById('modalGenericoHeader');
      header.className = 'modal-header text-white ' + (type === 'success' ? 'bg-success' : (type === 'error' ? 'bg-danger' : 'bg-warning text-dark'));
      new bootstrap.Modal(document.getElementById('modalGenerico')).show();
    }

    // SETUP INICIAL (VERIFICA SE EXISTE MASTER)
    (async function verificarSetup() {
      try {
        const res = await fetch('/api/setup/status');
        const data = await res.json();
        if (data.needsSetup) {
          new bootstrap.Modal(document.getElementById('modalSetupAdmin')).show();
        }
      } catch (e) {
        console.error('Erro ao verificar setup inicial:', e);
      }
    })();

    document.getElementById('formSetupAdmin').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('setupEmail').value;
      const res = await fetch('/api/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome: document.getElementById('setupNome').value,
          email: email,
          senha: document.getElementById('setupSenha').value
        })
      });
      const dados = await res.json();
      if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('modalSetupAdmin')).hide();
        document.getElementById('usuario').value = email;
        showModal('Sistema Configurado!', 'Administrador criado com sucesso. Faça login para acessar.', 'success');
      } else {
        showModal('Erro na Configuração', dados.error || 'Não foi possível criar o administrador.', 'error');
      }
    };

    // LOGIN
    document.getElementById('formLogin').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          usuario: document.getElementById('usuario').value,
          senha: document.getElementById('senha').value
        })
      });
      const dados = await res.json();
      if (res.ok) {
        sessionStorage.setItem('token', dados.token);
        sessionStorage.setItem('user', JSON.stringify(dados.user));


        if (dados.user.perfil === 'TUTOR') window.location.href = 'painel_cliente.html';
        else if (dados.user.perfil === 'VETERINARIO') window.location.href = 'painel_comum.html';
        else window.location.href = 'index.html'; // MASTER ou RECEPCIONISTA
      } else {
        document.getElementById('alerta').textContent = dados.message || 'Erro ao autenticar.';
        document.getElementById('alerta').classList.remove('d-none');
      }
    };


    // AUTO-CADASTRO TUTOR
    document.getElementById('formCadastro').onsubmit = async (e) => {
      e.preventDefault();
      const cpf = document.getElementById('cadCpf').value;
      if (cpf.length !== 11) return showModal('Aviso', 'O CPF deve conter exatos 11 números!', 'warning');


      const res = await fetch('/api/tutores/cadastro', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome: document.getElementById('cadNome').value,
          cpf: cpf,
          telefone: document.getElementById('cadTel').value,
          email: document.getElementById('cadEmail').value,
          endereco: document.getElementById('cadEnd').value
        })
      });


      const dados = await res.json();
      if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('modalCadastro')).hide();
        new bootstrap.Modal(document.getElementById('modalCadastroSucesso')).show();
      } else {
        showModal('Erro no Cadastro', dados.error || 'Não foi possível concluir o cadastro.', 'error');
      }
    };
  </script>
</body>
</html>
