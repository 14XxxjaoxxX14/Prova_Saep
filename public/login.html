<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><title>SGMC - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">
  
  <div class="card p-4 shadow" style="width:400px;">
    <h3 class="text-center text-warning fw-bold">SGMC</h3>
    <p class="text-center text-muted small">Acesso ao Sistema</p>
    <div id="alerta" class="alert alert-danger d-none small text-center"></div>
    <form id="formLogin">
      <input type="email" id="usuario" class="form-control mb-3" placeholder="E-mail" required>
      <input type="password" id="senha" class="form-control mb-3" placeholder="Senha" required>
      <button class="btn btn-warning w-100 fw-bold" type="submit">Entrar</button>
      <hr>
      <div class="text-center">
        <span class="small text-muted">Ainda não é cliente?</span>
        <button type="button" class="btn btn-outline-secondary btn-sm ms-2" data-bs-toggle="modal" data-bs-target="#modalCadastro">Cadastrar-se</button>
      </div>
    </form>
  </div>

  <!-- MODAL DE CADASTRO (CLIENTE) -->
  <div class="modal fade" id="modalCadastro" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-warning">
          <h5 class="modal-title fw-bold text-dark">Cadastro de Cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formCadastro">
            <div class="mb-3">
              <label class="form-label">Nome Completo</label>
              <input type="text" id="cadNome" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">CPF (Apenas números)</label>
              <input type="text" id="cadCpf" class="form-control" maxlength="11" oninput="this.value = this.value.replace(/\D/g, '')" required>
            </div>
            <div class="mb-3">
              <label class="form-label">E-mail</label>
              <input type="email" id="cadEmail" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Confirmar Cadastro</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Cadastro Sucesso -->
  <div class="modal fade" id="modalCadastroSucesso" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title fw-bold">Bem-vindo à SGMC!</h5>
        </div>
        <div class="modal-body p-4 text-center">
          <h4 class="text-success mb-3">Cadastro Concluído</h4>
          <p class="text-muted">A sua conta foi criada com sucesso.</p>
          <div class="alert alert-warning text-dark text-start">
            <strong>⚠️ Atenção:</strong> Para efetuar o login, a sua senha de acesso inicial é o seu <strong>próprio CPF</strong> (digitado apenas com os números).
          </div>
          <button type="button" class="btn btn-success w-100 fw-bold mt-2" onclick="window.location.reload()">Fazer Login Agora</button>
        </div>
      </div>
    </div>
  </div>

  
  <!-- Modal Generico para Alertas do Sistema -->
  <div class="modal fade" id="modalGenerico" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header text-white" id="modalGenericoHeader">
          <h5 class="modal-title fw-bold" id="modalGenericoTitle">Aviso</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4 text-center">
          <p class="mb-0 fs-5 text-muted" id="modalGenericoText"></p>
        </div>
        <div class="modal-footer justify-content-center border-0 pb-4">
          <button type="button" class="btn btn-secondary w-50 fw-bold" data-bs-dismiss="modal" id="modalGenericoBtn">Entendido</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    function showModal(title, text, type='success', onConfirm=null) {
      document.getElementById('modalGenericoTitle').innerText = title;
      document.getElementById('modalGenericoText').innerText = text;
      const header = document.getElementById('modalGenericoHeader');
      
      header.className = 'modal-header text-white ' + (type === 'success' ? 'bg-success' : (type === 'error' ? 'bg-danger' : 'bg-warning text-dark'));
      if(type === 'warning') header.querySelector('.btn-close').classList.remove('btn-close-white');
      else header.querySelector('.btn-close').classList.add('btn-close-white');
      
      const modal = new bootstrap.Modal(document.getElementById('modalGenerico'));
      
      if(onConfirm) {
        document.getElementById('modalGenericoBtn').onclick = () => { onConfirm(); modal.hide(); };
      } else {
        document.getElementById('modalGenericoBtn').onclick = null;
      }
      
      modal.show();
    }
  </script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // LOGIN
    document.getElementById('formLogin').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({usuario: document.getElementById('usuario').value, senha: document.getElementById('senha').value})
      });
      const dados = await res.json();
      if(res.ok) {
        sessionStorage.setItem('token', dados.token);
        sessionStorage.setItem('user', JSON.stringify(dados.user));
        
        if(dados.user.perfil === 'CLIENTE') window.location.href = 'painel_cliente.html';
        else if(dados.user.perfil === 'COMUM') window.location.href = 'painel_comum.html';
        else window.location.href = 'index.html';
      } else {
        document.getElementById('alerta').textContent = dados.message;
        document.getElementById('alerta').classList.remove('d-none');
      }
    };

    // CADASTRO
    document.getElementById('formCadastro').onsubmit = async (e) => {
      e.preventDefault();
      const cpf = document.getElementById('cadCpf').value;
      if(cpf.length !== 11) return showModal('Aviso', 'O CPF deve conter exatos 11 números!', 'warning');

      const res = await fetch('/api/clientes/cadastro', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          nome: document.getElementById('cadNome').value,
          cpf: cpf,
          email: document.getElementById('cadEmail').value
        })
      });
      
      const dados = await res.json();
      if(res.ok) {
        // Esconde o modal de cadastro e mostra o modal estilizado de sucesso
        const modalCad = bootstrap.Modal.getInstance(document.getElementById('modalCadastro'));
        modalCad.hide();
        const modalSuc = new bootstrap.Modal(document.getElementById('modalCadastroSucesso'));
        modalSuc.show();
      } else {
        showModal('Erro no Cadastro', dados.error, 'error');
      }
    };
  </script>
</body></html>
