<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PetCare - Painel Operacional</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>
    const user = JSON.parse(sessionStorage.getItem('user'));
    if (!user || (user.perfil !== 'VETERINARIO' && user.perfil !== 'RECEPCIONISTA')) {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body class="bg-light p-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div>
        <h3 class="mb-0">🐾 PetCare - <span id="tituloPainel"></span></h3>
        <small class="text-muted">Logado como: <strong id="uName"></strong> (<span id="uPerfil"></span>)</small>
      </div>
      <button class="btn btn-outline-danger" onclick="sessionStorage.clear(); window.location.href='login.html'">Sair</button>
    </div>

    <!-- ÁREA DO VETERINÁRIO -->
    <div id="areaVet" class="d-none">
      <div class="card p-3 shadow-sm border-0 mb-4">
        <h5 class="fw-bold">Minha Agenda de Atendimentos</h5>
        <hr>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-dark">
              <tr><th>Data/Hora</th><th>Pet (Espécie / Peso)</th><th>Tutor (Tel.)</th><th>Tipo</th><th>Observações</th><th>Valor</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody id="tbAgendaVet"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ÁREA DA RECEPÇÃO -->
    <div id="areaRecepcao" class="d-none">
      <div class="row g-4 mb-4">
        <div class="col-md-5">
          <div class="card p-3 shadow-sm border-0">
            <h5 class="fw-bold">Cadastrar Tutor</h5>
            <hr>
            <form id="fTutor">
              <input type="text" id="tNome" class="form-control mb-2" placeholder="Nome Completo" required>
              <input type="text" id="tCpf" class="form-control mb-2" placeholder="CPF (11 dígitos)" maxlength="11" oninput="this.value=this.value.replace(/\D/g,'')" required>
              <input type="text" id="tTel" class="form-control mb-2" placeholder="Telefone" required>
              <input type="email" id="tEmail" class="form-control mb-2" placeholder="E-mail" required>
              <input type="text" id="tEnd" class="form-control mb-3" placeholder="Endereço (opcional)">
              <button class="btn btn-primary w-100" type="submit">Cadastrar Tutor</button>
            </form>
          </div>
        </div>
        <div class="col-md-7">
          <div class="card p-3 shadow-sm border-0">
            <h5 class="fw-bold">Cadastrar Pet</h5>
            <hr>
            <form id="fPet" class="row g-2">
              <div class="col-md-6"><select id="pTutor" class="form-select" required></select></div>
              <div class="col-md-6"><input type="text" id="pNome" class="form-control" placeholder="Nome do Pet" required></div>
              <div class="col-md-4">
                <select id="pEspecie" class="form-select" required>
                  <option value="CAO">Cão</option>
                  <option value="GATO">Gato</option>
                  <option value="AVE">Ave</option>
                  <option value="ROEDOR">Roedor</option>
                  <option value="OUTRO">Outro</option>
                </select>
              </div>
              <div class="col-md-4"><input type="text" id="pRaca" class="form-control" placeholder="Raça (SRD)"></div>
              <div class="col-md-4">
                <select id="pSexo" class="form-select" required>
                  <option value="M">Macho</option>
                  <option value="F">Fêmea</option>
                </select>
              </div>
              <div class="col-md-6"><input type="number" step="0.01" id="pPeso" class="form-control" placeholder="Peso (kg)"></div>
              <div class="col-md-6"><input type="text" id="pChip" class="form-control" placeholder="Microchip (opcional)"></div>
              <div class="col-12"><button class="btn btn-dark w-100 mt-1" type="submit">Cadastrar Pet</button></div>
            </form>
          </div>
        </div>
      </div>

      <div class="card p-3 shadow-sm border-0 mb-4">
        <h5 class="fw-bold">Agendar Consulta</h5>
        <hr>
        <form id="fConsulta" class="row g-2">
          <div class="col-md-3"><select id="cPet" class="form-select" required></select></div>
          <div class="col-md-3"><select id="cVet" class="form-select" required></select></div>
          <div class="col-md-2"><input type="datetime-local" id="cData" class="form-control" required></div>
          <div class="col-md-2">
            <select id="cTipo" class="form-select" required>
              <option value="CONSULTA">Consulta</option>
              <option value="VACINA">Vacina</option>
              <option value="EXAME">Exame</option>
              <option value="CIRURGIA">Cirurgia</option>
              <option value="RETORNO">Retorno</option>
            </select>
          </div>
          <div class="col-md-2"><button class="btn btn-warning w-100 fw-bold" type="submit">Agendar</button></div>
        </form>
      </div>

      <div class="card p-3 shadow-sm border-0">
        <h5 class="fw-bold">Consultas Agendadas</h5>
        <hr>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-dark">
              <tr><th>Data</th><th>Pet (Tutor)</th><th>Veterinário</th><th>Tipo</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody id="tbConsultasRec"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Concluir Atendimento (Veterinário) -->
  <div class="modal fade" id="modalAtendimento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title fw-bold">Finalizar Atendimento</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="fFinalizar">
            <input type="hidden" id="finId">
            <div class="mb-3">
              <label class="form-label">Observações Clínicas / Prontuário</label>
              <textarea id="finObs" class="form-control" rows="3" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Valor do Atendimento (R$)</label>
              <input type="number" step="0.01" id="finValor" class="form-control" value="0.00" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Concluir Consulta</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Genérico -->
  <div class="modal fade" id="modalGenerico" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header text-white" id="modalGenericoHeader">
          <h5 class="modal-title fw-bold" id="modalGenericoTitle">Aviso</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4 text-center">
          <p class="mb-0 fs-5 text-muted" id="modalGenericoText"></p>
        </div>
        <div class="modal-footer justify-content-center border-0 pb-4">
          <button type="button" class="btn btn-secondary w-50 fw-bold" data-bs-dismiss="modal">Entendido</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const h = { 'Authorization': 'Bearer ' + sessionStorage.getItem('token'), 'Content-Type': 'application/json' };
    document.getElementById('uName').innerText = user.nome;
    document.getElementById('uPerfil').innerText = user.perfil;

    const statusBadge = {
      AGENDADA: 'bg-warning text-dark',
      EM_ANDAMENTO: 'bg-info text-dark',
      CONCLUIDA: 'bg-success',
      CANCELADA: 'bg-danger'
    };

    function showModal(title, text, type = 'success') {
      document.getElementById('modalGenericoTitle').innerText = title;
      document.getElementById('modalGenericoText').innerText = text;
      const header = document.getElementById('modalGenericoHeader');
      header.className = 'modal-header text-white ' + (type === 'success' ? 'bg-success' : (type === 'error' ? 'bg-danger' : 'bg-warning text-dark'));
      new bootstrap.Modal(document.getElementById('modalGenerico')).show();
    }

    // MODO VETERINÁRIO
    async function loadVetArea() {
      const list = await fetch(`/api/consultas/veterinario/${user.veterinario_id}`, { headers: h }).then(r => r.json());
      document.getElementById('tbAgendaVet').innerHTML = list.length
        ? list.map(c => `<tr>
            <td>${new Date(c.data_consulta).toLocaleString('pt-BR')}</td>
            <td><strong>${c.pet_nome}</strong> <small class="text-muted">(${c.especie}, ${Number(c.peso_kg).toFixed(1)}kg)</small></td>
            <td>${c.tutor_nome}<br><small class="text-muted">${c.tutor_telefone}</small></td>
            <td>${c.tipo_atendimento}</td>
            <td>${c.observacoes || '-'}</td>
            <td>R$ ${Number(c.valor || 0).toFixed(2)}</td>
            <td><span class="badge ${statusBadge[c.status] || 'bg-secondary'}">${c.status}</span></td>
            <td>
              ${c.status === 'AGENDADA' ? `<button class="btn btn-sm btn-info me-1" onclick="mudarStatus(${c.id}, 'EM_ANDAMENTO')">Iniciar</button>` : ''}
              ${c.status !== 'CONCLUIDA' && c.status !== 'CANCELADA' ? `<button class="btn btn-sm btn-success" onclick="abrirFinalizar(${c.id}, '${(c.observacoes || '').replace(/'/g, "\\'")}', ${c.valor || 0})">Concluir</button>` : '-'}
            </td>
          </tr>`).join('')
        : '<tr><td colspan="8" class="text-center text-muted">Nenhuma consulta na agenda.</td></tr>';
    }

    async function mudarStatus(id, status) {
      await fetch(`/api/consultas/${id}/processar`, {
        method: 'PUT',
        headers: h,
        body: JSON.stringify({ status })
      });
      loadVetArea();
    }

    function abrirFinalizar(id, obs, valor) {
      document.getElementById('finId').value = id;
      document.getElementById('finObs').value = obs;
      document.getElementById('finValor').value = valor;
      new bootstrap.Modal(document.getElementById('modalAtendimento')).show();
    }

    document.getElementById('fFinalizar').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('finId').value;
      await fetch(`/api/consultas/${id}/processar`, {
        method: 'PUT',
        headers: h,
        body: JSON.stringify({
          status: 'CONCLUIDA',
          observacoes: document.getElementById('finObs').value,
          valor: document.getElementById('finValor').value
        })
      });
      bootstrap.Modal.getInstance(document.getElementById('modalAtendimento')).hide();
      showModal('Concluído', 'Atendimento finalizado com sucesso!');
      loadVetArea();
    };

    // MODO RECEPCIONISTA
    async function loadRecepcao() {
      const [tutores, pets, vets, consultas] = await Promise.all([
        fetch('/api/tutores', { headers: h }).then(r => r.json()),
        fetch('/api/pets', { headers: h }).then(r => r.json()),
        fetch('/api/veterinarios', { headers: h }).then(r => r.json()),
        fetch('/api/consultas', { headers: h }).then(r => r.json())
      ]);

      document.getElementById('pTutor').innerHTML = '<option value="" disabled selected>Selecione o Tutor...</option>' +
        tutores.map(t => `<option value="${t.id}">${t.nome}</option>`).join('');

      document.getElementById('cPet').innerHTML = '<option value="" disabled selected>Selecione o Pet...</option>' +
        pets.map(p => `<option value="${p.id}">${p.nome} (${p.tutor_nome})</option>`).join('');

      document.getElementById('cVet').innerHTML = '<option value="" disabled selected>Selecione o Veterinário...</option>' +
        vets.filter(v => v.status === 'ATIVO').map(v => `<option value="${v.id}">${v.nome}</option>`).join('');

      document.getElementById('tbConsultasRec').innerHTML = consultas.map(c => `<tr>
        <td>${new Date(c.data_consulta).toLocaleString('pt-BR')}</td>
        <td>${c.pet_nome} <small class="text-muted">(${c.tutor_nome})</small></td>
        <td>${c.veterinario_nome}</td>
        <td>${c.tipo_atendimento}</td>
        <td><span class="badge ${statusBadge[c.status] || 'bg-secondary'}">${c.status}</span></td>
        <td>
          ${c.status === 'AGENDADA' ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelarRec(${c.id})">Cancelar</button>` : '-'}
        </td>
      </tr>`).join('');
    }

    document.getElementById('fTutor').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch('/api/tutores/cadastro', {
        method: 'POST',
        headers: h,
        body: JSON.stringify({
          nome: document.getElementById('tNome').value,
          cpf: document.getElementById('tCpf').value,
          telefone: document.getElementById('tTel').value,
          email: document.getElementById('tEmail').value,
          endereco: document.getElementById('tEnd').value
        })
      });
      const data = await res.json();
      if (res.ok) {
        showModal('Sucesso', 'Tutor cadastrado! Senha inicial = CPF.');
        document.getElementById('fTutor').reset();
        loadRecepcao();
      } else {
        showModal('Erro', data.error, 'error');
      }
    };

    document.getElementById('fPet').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch('/api/pets', {
        method: 'POST',
        headers: h,
        body: JSON.stringify({
          tutor_id: document.getElementById('pTutor').value,
          nome: document.getElementById('pNome').value,
          especie: document.getElementById('pEspecie').value,
          raca: document.getElementById('pRaca').value || 'SRD',
          sexo: document.getElementById('pSexo').value,
          peso_kg: document.getElementById('pPeso').value || 0,
          microchip: document.getElementById('pChip').value || null
        })
      });
      if (res.ok) {
        showModal('Sucesso', 'Pet cadastrado!');
        document.getElementById('fPet').reset();
        loadRecepcao();
      } else {
        const err = await res.json();
        showModal('Erro', err.error, 'error');
      }
    };

    document.getElementById('fConsulta').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch('/api/consultas', {
        method: 'POST',
        headers: h,
        body: JSON.stringify({
          pet_id: document.getElementById('cPet').value,
          veterinario_id: document.getElementById('cVet').value,
          data_consulta: document.getElementById('cData').value,
          tipo_atendimento: document.getElementById('cTipo').value
        })
      });
      if (res.ok) {
        showModal('Sucesso', 'Consulta agendada!');
        document.getElementById('fConsulta').reset();
        loadRecepcao();
      } else {
        const err = await res.json();
        showModal('Erro', err.error, 'error');
      }
    };

    async function cancelarRec(id) {
      await fetch(`/api/consultas/${id}/processar`, {
        method: 'PUT',
        headers: h,
        body: JSON.stringify({ status: 'CANCELADA' })
      });
      loadRecepcao();
    }

    if (user.perfil === 'VETERINARIO') {
      document.getElementById('tituloPainel').innerText = 'Painel do Veterinário';
      document.getElementById('areaVet').classList.remove('d-none');
      loadVetArea();
    } else {
      document.getElementById('tituloPainel').innerText = 'Recepção e Agendamentos';
      document.getElementById('areaRecepcao').classList.remove('d-none');
      loadRecepcao();
    }
  </script>
</body>
</html>
