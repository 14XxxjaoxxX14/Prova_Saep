<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"><title>SGMC - Minhas Retiradas (Colaborador)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    const user = JSON.parse(sessionStorage.getItem('user'));
    if(!user || user.perfil !== 'COMUM') window.location.href = 'login.html';
  </script>
</head>
<body class="bg-light p-4">
  <div class="container">
    <div class="d-flex justify-content-between mb-4">
      <h3>Portal do Colaborador - Requisições Internas</h3>
      <button class="btn btn-outline-danger" onclick="sessionStorage.clear(); window.location.href='login.html'">Sair</button>
    </div>
    
    <div class="row">
      <div class="col-md-4">
        <div class="card p-3 shadow-sm">
          <h5>Solicitar Material para Obra</h5>
          <form id="fReq">
            <select id="rMat" class="form-select mb-2" required></select>
            <input type="number" id="rQtd" class="form-control mb-2" placeholder="Quantidade" required>
            <input type="text" id="rObra" class="form-control mb-2" placeholder="Obra Destino" required>
            <textarea id="rMotivo" class="form-control mb-3" placeholder="Motivo / Uso" required></textarea>
            <button class="btn btn-primary w-100" type="submit">Enviar Solicitação</button>
          </form>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card p-3 shadow-sm">
          <h5>Minhas Solicitações</h5>
          <table class="table">
            <thead class="table-dark"><tr><th>Material</th><th>Qtd</th><th>Obra</th><th>Status</th></tr></thead>
            <tbody id="tbMinhasReq"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  
  <!-- Modal Generico para Alertas do Sistema -->
  <div class="modal fade" id="modalGenerico" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header text-white" id="modalGenericoHeader">
          <h5 class="modal-title fw-bold" id="modalGenericoTitle">Aviso</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4 text-center">
          <p class="mb-0 fs-5 text-muted" id="modalGenericoText"></p>
        </div>
        <div class="modal-footer justify-content-center border-0 pb-4">
          <button type="button" class="btn btn-secondary w-50 fw-bold" data-bs-dismiss="modal" id="modalGenericoBtn">Entendido</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    function showModal(title, text, type='success', onConfirm=null) {
      document.getElementById('modalGenericoTitle').innerText = title;
      document.getElementById('modalGenericoText').innerText = text;
      const header = document.getElementById('modalGenericoHeader');
      
      header.className = 'modal-header text-white ' + (type === 'success' ? 'bg-success' : (type === 'error' ? 'bg-danger' : 'bg-warning text-dark'));
      if(type === 'warning') header.querySelector('.btn-close').classList.remove('btn-close-white');
      else header.querySelector('.btn-close').classList.add('btn-close-white');
      
      const modal = new bootstrap.Modal(document.getElementById('modalGenerico'));
      
      if(onConfirm) {
        document.getElementById('modalGenericoBtn').onclick = () => { onConfirm(); modal.hide(); };
      } else {
        document.getElementById('modalGenericoBtn').onclick = null;
      }
      
      modal.show();
    }
  </script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const h = { 'Authorization': 'Bearer ' + sessionStorage.getItem('token'), 'Content-Type': 'application/json' };
    async function loadData() {
      const mats = await fetch('/api/materiais', {headers:h}).then(res=>res.json());
      document.getElementById('rMat').innerHTML = '<option value="" disabled selected>Selecione um Material</option>' + 
        mats.map(m=>`<option value="${m.id}">${m.nome} (Estoque: ${m.quantidade_estoque})</option>`).join('');
      
      const reqs = await fetch(`/api/requisicoes/usuario/${user.id}`, {headers:h}).then(res=>res.json());
      document.getElementById('tbMinhasReq').innerHTML = reqs.map(r=>`<tr>
        <td>${r.material_nome}</td><td>${r.quantidade}</td><td>${r.obra_destino}</td>
        <td><span class="badge bg-${r.status==='APROVADA'?'success':(r.status==='REJEITADA'?'danger':'warning')} text-dark">${r.status}</span></td>
      </tr>`).join('');
    }

    document.getElementById('fReq').onsubmit = async(e) => {
      e.preventDefault();
      await fetch('/api/requisicoes', {
        method:'POST', headers:h,
        body: JSON.stringify({
          usuario_id: user.id, material_id: document.getElementById('rMat').value,
          quantidade: document.getElementById('rQtd').value,
          obra_destino: document.getElementById('rObra').value,
          motivo: document.getElementById('rMotivo').value
        })
      });
      document.getElementById('fReq').reset(); loadData();
      showModal('Sucesso', 'Solicitação interna enviada para análise!', 'success');
    };
    loadData();
  </script>
</body></html>
